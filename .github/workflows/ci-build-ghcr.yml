name: Build & Publish Trajectory Parser to GHCR

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore dotnet-weaver-lammps-hrt.sln

      - name: Build and Test Solution
        run: dotnet test dotnet-weaver-lammps-hrt.sln --no-restore --configuration Release --verbosity normal

      - name: Set Lowercase Image Name for GHCR
        # WHAT: Format the container repository destination in all-lowercase.
        # WHY:  The Open Container Initiative (OCI) and GitHub Container Registry (GHCR) enforce
        #       lowercase image tags; any capitalized repository names cause immediate 400 rejection.
        # HOW:  Transform $GITHUB_REPOSITORY using bash parameter expansion (${VAR,,}).
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}/trajectory-parser" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Image Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and Push Parser Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/parser/Dockerfile.parser
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
