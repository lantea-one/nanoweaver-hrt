<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#141c2f"/>
    </linearGradient>
    <linearGradient id="cyan-magenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#ff2a85"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <!-- DNA Double Helix Network Nodes -->
    <path d="M128 96 C 256 160, 256 352, 384 416 M384 96 C 256 160, 256 352, 128 416" stroke="url(#cyan-magenta)" stroke-width="12" fill="none" stroke-linecap="round"/>
    <line x1="160" y1="160" x2="352" y2="352" stroke="#00f5d4" stroke-width="4" stroke-opacity="0.6"/>
    <line x1="200" y1="240" x2="312" y2="272" stroke="#ff2a85" stroke-width="4" stroke-opacity="0.6"/>
    <line x1="150" y1="330" x2="362" y2="180" stroke="#00f5d4" stroke-width="4" stroke-opacity="0.6"/>
    <!-- Nodes -->
    <circle cx="128" cy="96" r="20" fill="#00f5d4"/>
    <circle cx="384" cy="96" r="20" fill="#ff2a85"/>
    <circle cx="256" cy="256" r="28" fill="#00f5d4"/>
    <circle cx="128" cy="416" r="20" fill="#ff2a85"/>
    <circle cx="384" cy="416" r="20" fill="#00f5d4"/>
  </g>
</svg>
