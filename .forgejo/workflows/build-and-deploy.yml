name: Build & Publish Trajectory Parser to Forgejo Package Registry

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: git.lantea.one

jobs:
  build-test-and-publish:
    # WHAT: Run on the archlinux runners that carry qemu-user-static and
    #       qemu-user-static-binfmt, rather than the plain `archlinux` pool.
    # WHY:  The published images are pinned to linux/amd64 (see the build steps), but the
    #       `archlinux` label also resolves to aarch64 machines. Without registered binfmt
    #       handlers a non-native platform cannot be built at all, so the job's success would
    #       depend on which machine happened to claim it. This label guarantees the emulation
    #       is present, which is also the prerequisite for publishing arm64 images later.
    # HOW:  Select the runner label whose hosts have the binfmt handlers installed.
    runs-on: archlinux-multi-platform
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Restore Dependencies
        run: dotnet restore NanoWeaverHrt.slnx

      - name: Verify .NET Code Formatting
        # WHAT: Enforces standard .NET formatting and style conventions.
        # WHY:  Guarantees uniform code formatting across all contributor commits and fails the build if changes are needed.
        # HOW:  Runs dotnet format --verify-no-changes with zero-tolerance for unformatted files.
        run: dotnet format NanoWeaverHrt.slnx --no-restore --verify-no-changes --verbosity normal

      - name: Verify JavaScript Code & Coverage Gate
        # WHAT: Executes client-side JavaScript visualization tests.
        # WHY:  Enforces 100% line, branch, and function coverage across wwwroot/js/weaver-visualizer.js.
        # HOW:  Runs node --test with native experimental coverage thresholds set to 100%.
        run: npm test

      - name: Build and Test Solution with Coverage
        # WHAT: Runs the test suite in Release configuration with cross-platform code coverage collection.
        # WHY:  Ensures that all unit and integration tests pass and emits Cobertura coverage data.
        # HOW:  Uses dotnet test with coverlet.runsettings configuring 100% line and branch thresholds.
        run: dotnet test NanoWeaverHrt.slnx --no-restore --configuration Release --settings coverlet.runsettings --collect:"XPlat Code Coverage" --verbosity normal

      - name: Enforce 100% Line and Branch Code Coverage Threshold
        # WHAT: Parses the generated coverage report and validates that line-rate and branch-rate are both 100%.
        # WHY:  Fails the build immediately if any line or branch is uncovered.
        # HOW:  Inspects coverage.cobertura.xml line-rate and branch-rate attributes and exits 1 on any deficiency.
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          import glob
          import os
          import sys

          files = glob.glob('**/coverage.cobertura.xml', recursive=True)
          if not files:
              print('::error::No coverage.cobertura.xml report found!')
              sys.exit(1)

          latest_file = max(files, key=lambda f: os.path.getmtime(f))
          print(f'Evaluating coverage report: {latest_file}')
          tree = ET.parse(latest_file)
          root = tree.getroot()

          line_rate = float(root.attrib.get('line-rate', 0)) * 100
          branch_rate = float(root.attrib.get('branch-rate', 0)) * 100

          print(f'Line Coverage: {line_rate:.2f}%')
          print(f'Branch Coverage: {branch_rate:.2f}%')

          if line_rate < 100.0 or branch_rate < 100.0:
              for pkg in root.findall('.//package'):
                  for cls in pkg.findall('.//class'):
                      c_line = float(cls.attrib.get('line-rate', 1)) * 100
                      c_branch = float(cls.attrib.get('branch-rate', 1)) * 100
                      if c_line < 100 or c_branch < 100:
                          fname = cls.attrib.get('filename', '')
                          cname = cls.attrib.get('name', '')
                          print(f'::error file={fname}::{cname} uncovered (Line: {c_line:.2f}%, Branch: {c_branch:.2f}%)')
                          for l in cls.findall('.//line'):
                              if int(l.attrib.get('hits', 0)) == 0:
                                  print(f'  Uncovered line: {l.attrib.get(\"number\")}')
                              if 'condition-coverage' in l.attrib and '100%' not in l.attrib['condition-coverage']:
                                  print(f'  Uncovered branch: {l.attrib.get(\"number\")} [{l.attrib.get(\"condition-coverage\")}]')

          if line_rate < 100.0:
              print(f'::error::Line coverage ({line_rate:.2f}%) is below required 100.0% threshold!')
              sys.exit(1)

          if branch_rate < 100.0:
              print(f'::error::Branch coverage ({branch_rate:.2f}%) is below required 100.0% threshold!')
              sys.exit(1)

          print('SUCCESS: Both line and branch coverage are at 100.00%.')
          "

      - name: Verify Documentation Markdown Math Delimiters
        # WHAT: Verifies zero broken LaTeX math interpolation in documentation markdown files.
        # WHY:  Guarantees flawless rendering across Docsify, GitHub Pages, and GitHub.
        # HOW:  Executes Python regex scanner checking for unescaped single-dollar and inline double-dollar delimiters.
        run: |
          python3 - << 'EOF'
          import glob, re, sys

          files = sorted(set(glob.glob('docs/**/*.md', recursive=True) + glob.glob('docs/*.md') + ['README.md']))
          violations = []
          inline_display_violations = []

          for f in files:
              content = open(f, encoding='utf-8').read()
              code_stripped = re.sub(r'```.*?```', '', content, flags=re.DOTALL)
              code_stripped = re.sub(r'`.*?`', '', code_stripped)
              
              matches = re.findall(r'(?<!\$)\$(?!\$)(.*?)(?<!\$)\$(?!\$)', code_stripped)
              if matches:
                  violations.append((f, len(matches), matches[:3]))
                  
              for line_idx, line in enumerate(code_stripped.split('\n'), 1):
                  sline = line.strip()
                  if '$$' in sline:
                      if not (sline.startswith('$$') and sline.endswith('$$')) or sline.count('$$') > 2:
                          inline_display_violations.append((f, line_idx, sline))

          if violations:
              print('ERROR: Found unescaped/broken single-dollar math delimiters in documentation:')
              for f, count, samples in violations:
                  print(f'  {f}: {count} violations (Samples: {samples})')
              print('Use clean Unicode symbols (e.g. µL, °C, 17β-estradiol, Mg²⁺) instead of $...$')

          if inline_display_violations:
              print('ERROR: Found inline double-dollar ($$) math delimiters embedded in text/tables:')
              for f, line_idx, line in inline_display_violations:
                  print(f'  {f}:{line_idx}: {line}')
              print('Standalone equations must be fenced on their own lines ($$...$$). Use clean Unicode for inline text.')

          if violations or inline_display_violations:
              sys.exit(1)

          print(f'SUCCESS: Scanned {len(files)} markdown files: Zero broken LaTeX interpolation tokens found.')
          EOF

      - name: Verify XML Docblock Completeness
        # WHAT: Asserts every documented member carries one <param> per parameter and a <returns>.
        # WHY:  Enforces AGENTS.md Prime Directive 2, which the compiler cannot check. CS1591 fires
        #       only on a wholly missing doc comment and only for publicly visible members, and
        #       CS1573 fires only when a comment already has SOME <param> tags. A comment holding
        #       just a <summary> produces no diagnostic at all, so without this step the directive
        #       is unenforceable even with warnings treated as errors.
        # HOW:  Runs the committed scanner, which exits non-zero on any incomplete member.
        run: python3 -I scripts/check-docblocks.py src

      - name: Enforce Un-Excluded Coverage Ratchet
        # WHAT: Re-measures coverage with compiler-generated code included and compares it to coverage-baseline.json.
        # WHY:  The 100% step above excludes endpoint lambdas and async state machines, so it cannot see code
        #       such as unexercised API handlers. The ratchet makes that gap visible and only lets it shrink.
        # HOW:  Runs the tests with coverage-full.runsettings (PostgreSQL-absent configuration), then the
        #       committed comparison script, which exits non-zero on any regression or stale baseline.
        run: |
          rm -rf artifacts/coverage-full
          dotnet test NanoWeaverHrt.slnx --configuration Release --settings coverage-full.runsettings --collect:"XPlat Code Coverage" --results-directory artifacts/coverage-full --verbosity minimal
          python3 -I scripts/check-coverage-ratchet.py artifacts/coverage-full coverage-baseline.json

      - name: Set Lowercase Image Name for Forgejo Container Registry
        # WHAT: Format the container repository destination in all-lowercase.
        # WHY:  The Open Container Initiative (OCI) and Forgejo Container Registry enforce
        #       lowercase image tags; any capitalized repository names cause immediate 400 rejection.
        # HOW:  Transform $GITHUB_REPOSITORY using bash parameter expansion (${VAR,,}).
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to Forgejo Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract Web Docker Image Metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/nanoweaver-hrt-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and Push Web & Parser Container Image
        # WHAT: Build this image for linux/amd64 only, never the runner's native architecture.
        # WHY:  The .NET base images are multi-arch, so without a pin this image silently
        #       follows whatever architecture the runner happens to be. Its companion
        #       simulation image is amd64-only (see that step), and a stack whose two
        #       containers disagree on architecture cannot run together. Pinning both to the
        #       single architecture the project supports keeps the compose stack coherent.
        # HOW:  Pass an explicit single-platform list to docker/build-push-action.
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/web/Dockerfile.web
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

      - name: Extract Simulation Docker Image Metadata
        id: meta-simulation
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/nanoweaver-hrt-simulation
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and Push Simulation Container Image
        # WHAT: Build this image for linux/amd64 only, never the runner's native architecture.
        # WHY:  The simulation image installs the Intel GPU runtime (intel-opencl-icd,
        #       intel-level-zero-gpu, libze1), and repositories.intel.com publishes those
        #       packages for amd64 alone - its binary-arm64 index returns 403. Built natively on
        #       an aarch64 runner this image dies deep inside apt with "unable to locate
        #       package"; pinning the platform builds it under binfmt emulation instead, so the
        #       result does not depend on which machine claimed the job.
        # HOW:  Pass an explicit single-platform list to docker/build-push-action.
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/simulation/Dockerfile.simulation
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-simulation.outputs.tags }}
          labels: ${{ steps.meta-simulation.outputs.labels }}

      - name: Ensure Container Packages Linked to Repository
        # WHAT: Guarantee OCI container packages appear on repository's Packages tab in Forgejo.
        # WHY:  Packages without matching repo names (nanoweaver-hrt-web, nanoweaver-hrt-simulation)
        #       default to organization-level unless explicitly linked via Forgejo's link API.
        # HOW:  Call POST /api/v1/packages/{owner}/container/{name}/-/link/{repo} with auth token.
        if: github.event_name != 'pull_request'
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          for pkg in nanoweaver-hrt-web nanoweaver-hrt-simulation; do
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}" \
              "https://${{ env.REGISTRY }}/api/v1/packages/${{ github.repository_owner }}/container/${pkg}/-/link/${REPO_NAME}" || true
          done
