# ==============================================================================
# Sovereign Storage & Columnar Analytics Infrastructure
# ------------------------------------------------------------------------------
# WHAT: PostgreSQL container embedding the high-performance pg_duckdb extension.
# WHY:  Enables zero-copy, vectorized SQL queries over massive columnar Parquet
#       trajectory files generated by the .NET 10 SIMD parsing pipeline.
# HOW:  Spins up pgduckdb/pgduckdb:18-v1.1.1 with shared Parquet volume mounts.
#
# USAGE:
#   docker compose -f docker-compose.yml -f docker-compose.infra.yml up -d
#
# CREDENTIALS:
#   The password below is a placeholder that is published in this public repository, so it
#   grants nothing on a correctly deployed node: the database port is bound to loopback only
#   and the parser reaches it over the private compose network. Set WEAVER_POSTGRES_PASSWORD
#   in your .env (or shell) before the first `up` to use a real one; both the server and the
#   parser read the same variable, so they can never drift apart.
#
# NOTE ON THE SILENT SQLITE FALLBACK:
#   Without POSTGRES_CONNECTION_STRING the parser used the built-in default Host=localhost,
#   which inside its own container is the container itself. The connection was refused, the
#   store caught the failure and quietly switched to SQLite, so this overlay's PostgreSQL
#   database was never actually used. The service entry below points the parser at the
#   pg-duckdb service and waits for its healthcheck, which closes that gap.
# ==============================================================================

name: nanoweaver-hrt

services:
  pg-duckdb:
    image: pgduckdb/pgduckdb:18-v1.1.1
    container_name: weaver-pg-duckdb
    hostname: storage-node
    restart: unless-stopped
    # WHAT: Publishes PostgreSQL on the loopback interface only.
    # WHY:  This database holds every identity, public key, role and patient PHI record on
    #       the node, and it ships with a default password that is published in this public
    #       repository, so it must never be reachable off-box (Prime Directive #9). A bare
    #       "5432:5432" binds 0.0.0.0 through a Docker NAT rule that host ufw/firewalld
    #       rules do not filter, which means a laptop on the same cafe network - or the
    #       whole internet on a VPS - could connect with a password anyone can read.
    # HOW:  Prefixes the host interface with 127.0.0.1. The parser container reaches the
    #       database over the compose network (storage-node:5432) and needs no published
    #       port at all; loopback is kept so a host-side `dotnet run` and `psql` still work,
    #       which is what the default Host=localhost;Port=5432 connection string expects.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: weaver_hrt
      POSTGRES_USER: weaver
      POSTGRES_PASSWORD: ${WEAVER_POSTGRES_PASSWORD:-weaver_secret_change_me}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Persistent PostgreSQL catalog and metadata volume
      - postgres_metadata:/var/lib/postgresql/data
      # Shared columnar Parquet directory written by the .NET trajectory parser
      - ./simulations/parquet:/workspace/parquet:rw
      # Read-only access to raw molecular trajectories
      - ./simulations/shared-data:/workspace/data:ro
      # Initialization SQL scripts to enable pg_duckdb extension automatically
      - ./compose/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weaver -d weaver_hrt"]
      interval: 10s
      timeout: 5s
      retries: 5

  trajectory-parser:
    image: git.lantea.one/lantea-one/nanoweaver-hrt-web:latest
    environment:
      - TRAJECTORY_PARQUET_DIR=/workspace/parquet
      # WHAT: Points the parser at this overlay's PostgreSQL service.
      # WHY:  Without it the parser resolved the built-in default host (localhost) to its own
      #       container, failed to connect and silently fell back to SQLite, so the database this
      #       overlay exists to provide went unused.
      # HOW:  "pg-duckdb" is the compose service name and therefore its network alias; the
      #       container's own hostname, storage-node, resolves to the same address.
      - POSTGRES_CONNECTION_STRING=Host=pg-duckdb;Port=5432;Database=weaver_hrt;Username=weaver;Password=${WEAVER_POSTGRES_PASSWORD:-weaver_secret_change_me};Timeout=5
    volumes:
      - ./simulations/parquet:/workspace/parquet:rw
    # WHAT: Waits for the database to pass its healthcheck before the parser starts.
    # WHY:  The fallback to SQLite is silent, so a parser that starts one second too early would
    #       quietly run on the wrong database for the rest of its life.
    # HOW:  depends_on with condition: service_healthy, merged with the base stack's dependency.
    depends_on:
      pg-duckdb:
        condition: service_healthy

volumes:
  postgres_metadata:
    name: weaver_postgres_metadata
