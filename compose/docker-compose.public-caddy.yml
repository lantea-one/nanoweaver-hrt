# ==============================================================================
# Docker Compose Override: Hardened Caddy Reverse Proxy & Automatic Let's Encrypt SSL
# ------------------------------------------------------------------------------
# WHAT: Production-hardened reverse proxy service provisioning automated TLS/SSL
#       certificates via Let's Encrypt / ZeroSSL, terminating HTTPS on port 443,
#       and proxying WebSockets / HTTP to the Trajectory Parser service.
# WHY:  Secures public deployments against eavesdropping, token interception, and
#       man-in-the-middle attacks without requiring manual certbot renewal scripts.
# HOW:  Spins up an official Caddy container with dropped privileges, mounts persistent
#       data/config volumes for ACME certificates, rebinds the internal parser port
#       to loopback only (127.0.0.1:5000), unpublishes the simulation daemon entirely,
#       and proxies public ports 80/443.
#
# USAGE:
#   # 1. Set your public domain name and contact email:
#   export DOMAIN="hrt.yourdomain.org"
#   export ACME_EMAIL="admin@yourdomain.org"
#
#   # 2. Launch the stack with the Caddy public overlay:
#   docker compose -f docker-compose.yml -f compose/docker-compose.public-caddy.yml up -d
#
# IDENTITY: the container user and GPU groups come from .env (see example.env);
#           this overlay must not redefine them.
# ==============================================================================

name: nanoweaver-hrt

services:
  # ----------------------------------------------------------------------------
  # Simulation Daemon: No Published Port At All
  # WHAT: Drops every host port mapping for the unauthenticated simulation daemon.
  # WHY:  Prime Directive #9 - nothing in this stack may be reachable from the public
  #       internet except the reverse proxy. The daemon has no authentication, answers
  #       job submissions, and fingerprints the node, so publishing it on a public host
  #       is worse than publishing port 5000. The base stack binds it to 127.0.0.1; on a
  #       public deployment it gets no host binding whatsoever.
  # HOW:  "ports: !override []" replaces the inherited list instead of merging with it.
  #       The parser still reaches the daemon over the compose network as simulation-node:8080.
  # ----------------------------------------------------------------------------
  simulation:
    ports: !override []

  # ----------------------------------------------------------------------------
  # Trajectory Parser Internal Port Rebinding
  # Rebinds port 5000 strictly to localhost (127.0.0.1) to block direct public access.
  # ----------------------------------------------------------------------------
  trajectory-parser:
    image: git.lantea.one/lantea-one/nanoweaver-hrt-web:latest
    ports: !override
      - "127.0.0.1:5000:5000"

  # ----------------------------------------------------------------------------
  # Caddy Reverse Proxy with Automatic Let's Encrypt TLS
  # ----------------------------------------------------------------------------
  caddy-proxy:
    image: caddy:2-alpine
    container_name: weaver-caddy-proxy
    hostname: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP: Auto-redirects to HTTPS and handles ACME challenges
      - "443:443"     # HTTPS: Automated Let's Encrypt TLS 1.3
      - "443:443/udp" # HTTP/3 (QUIC) support
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-internal}
    volumes:
      - ./compose/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - trajectory-parser
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
