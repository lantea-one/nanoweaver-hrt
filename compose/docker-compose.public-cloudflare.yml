# ==============================================================================
# Docker Compose Override: Cloudflare Zero Trust Tunnel (CGNAT / No Open Ports)
# ------------------------------------------------------------------------------
# WHAT: Outbound-only tunnel exposing the Trajectory Parser via Cloudflare's edge.
# WHY:  Perfect for HomeLab / DIY researchers whose ISPs block inbound ports 80/443,
#       or who operate behind Carrier-Grade NAT (CGNAT) without a public IPv4.
# HOW:  Runs the lightweight `cloudflared` daemon which establishes an encrypted
#       outbound QUIC/TLS tunnel to Cloudflare. No open router ports required! The
#       simulation daemon is unpublished entirely and the parser stays on 127.0.0.1.
#
# USAGE:
#   # 1. Obtain your Tunnel Token from Cloudflare Zero Trust Dashboard:
#   export TUNNEL_TOKEN="eyJhIjoi..."
#
#   # 2. Launch the stack:
#   docker compose -f docker-compose.yml -f compose/docker-compose.public-cloudflare.yml up -d
#
# IDENTITY: the container user and GPU groups come from .env (see example.env);
#           this overlay must not redefine them.
# ==============================================================================

name: nanoweaver-hrt

services:
  # ----------------------------------------------------------------------------
  # Simulation Daemon: No Published Port At All
  # WHAT: Drops every host port mapping for the unauthenticated simulation daemon.
  # WHY:  Prime Directive #9 - nothing in this stack may be reachable from the public
  #       internet except the reverse proxy. The daemon has no authentication, answers
  #       job submissions, and fingerprints the node, so publishing it on a public host
  #       is worse than publishing port 5000. The base stack binds it to 127.0.0.1; on a
  #       public deployment it gets no host binding whatsoever.
  # HOW:  "ports: !override []" replaces the inherited list instead of merging with it.
  #       The parser still reaches the daemon over the compose network as simulation-node:8080.
  # ----------------------------------------------------------------------------
  simulation:
    ports: !override []

  # ----------------------------------------------------------------------------
  # Trajectory Parser Internal Port Rebinding
  # Binds strictly to 127.0.0.1:5000 so the local host can inspect it if needed.
  # ----------------------------------------------------------------------------
  trajectory-parser:
    image: git.lantea.one/lantea-one/nanoweaver-hrt-web:latest
    ports: !override
      - "127.0.0.1:5000:5000"

  # ----------------------------------------------------------------------------
  # Cloudflare Tunnel Daemon (cloudflared)
  # ----------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: weaver-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - trajectory-parser
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
