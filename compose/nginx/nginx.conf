# ==============================================================================
# Nginx Hardened Reverse Proxy Template
# ------------------------------------------------------------------------------
# WHAT: Production Nginx virtual host with Let's Encrypt SSL, HSTS, SignalR
#       WebSocket upgrading, and zero-buffering for live trajectory streams.
# WHY:  Delivers high throughput, low latency, and robust cryptographic security.
# HOW:  Variables (${DOMAIN}) are dynamically substituted at startup by Nginx Alpine.
# ==============================================================================

# WHAT: Upstream WebSocket connection mapping
# WHY:  Correctly upgrades HTTP/1.1 connections to WebSockets when requested
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ------------------------------------------------------------------------------
# HTTP Server: Port 80 (ACME Challenge + Permanent HTTPS Redirect)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};
    server_tokens off;

    # WHAT: Certbot ACME HTTP-01 challenge directory
    # WHY:  Allows Let's Encrypt to verify domain ownership during issuance & renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # WHAT: Permanent 301 redirect to HTTPS
    # WHY:  Enforces encrypted communication across all incoming requests
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS Server: Port 443 (Hardened TLS Termination & Reverse Proxy)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN};
    server_tokens off;

    # WHAT: Let's Encrypt SSL certificate and private key paths
    # WHY:  Certbot writes issued certificates to /etc/letsencrypt/live/${DOMAIN}/
    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # WHAT: Modern Cryptographic Protocols and Cipher Suites (TLS 1.2 & TLS 1.3)
    # WHY:  Disables obsolete and broken ciphers (SSLv3, TLS 1.0, TLS 1.1, RC4, 3DES)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # WHAT: SSL Session Caching and Session Tickets
    # WHY:  Optimizes TLS handshake latency for recurring connections
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # WHAT: OCSP Stapling
    # WHY:  Speeds up TLS validation by bundling the CA's revocation status
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # WHAT: Hardened Security Response Headers
    # WHY:  Enforces strict transport security, prevents iframe hijacking and MIME sniffing
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # WHAT: Maximum client body size for dataset uploads
    # WHY:  Allows uploading large .tar.gz and .parquet trajectory bundles up to 500MB
    client_max_body_size 500M;

    # --------------------------------------------------------------------------
    # Reverse Proxy Location: Forwarding to .NET 10 Trajectory Parser
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://trajectory-parser:5000;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Blazor Server & SignalR WebSocket upgrade support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Zero-buffering for low-latency trajectory coordinate streaming
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
